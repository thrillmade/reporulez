name: test

# Reporulez is bash + JSON + YAML, no test runner. `test` here lints
# every shipped artifact so a malformed PR breaks loudly here rather
# than at install time on someone else's repo:
#   - `bash -n` per-file syntax check on bin/*.sh
#   - jq-parse every ruleset/template JSON
#   - yaml-parse every dependabot template YAML

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: bash -n on every shipped script
        run: |
          set -euo pipefail
          find bin -type f -name '*.sh' -print0 \
            | xargs -0 -I{} bash -n {}
          echo "All bash scripts pass syntax check."

      - name: jq-validate every shipped JSON
        run: |
          set -euo pipefail
          find rulesets templates -type f -name '*.json' -print0 \
            | xargs -0 -I{} jq -e . {} > /dev/null
          echo "All shipped JSON parses cleanly."

      - name: yaml-validate every shipped YAML template
        # Catches malformed dependabot templates (and any future *.yml
        # under templates/) before they ship. Python is preinstalled
        # on ubuntu-latest with PyYAML available via pip; we install
        # if missing rather than depending on system state.
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          find templates -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 \
            | xargs -0 -I{} python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1])); print(f'  {sys.argv[1]}: OK')" {}
          echo "All shipped YAML templates parse cleanly."
